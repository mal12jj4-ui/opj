name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every file was uploaded
        run: |
          missing=0
          while read -r f; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=$((missing+1)); fi
          done < MANIFEST.txt
          find src -type f | sort > /tmp/have.txt
          grep '^src/' MANIFEST.txt | sort > /tmp/want.txt
          comm -23 /tmp/have.txt /tmp/want.txt | sed 's/^/UNEXPECTED (old or duplicate file, delete it): /' | tee /tmp/extra.txt
          echo "Missing files: $missing"
          test "$missing" -eq 0
          test ! -s /tmp/extra.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: ggclient-jar
          path: build/libs/*.jar
